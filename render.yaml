# Render Blueprint (free web service). On render.com: New > Blueprint > pick this repository.
# Database: TiDB Cloud Starter (free). Background jobs: a free cron service calls /jobs/run/ (see docs/FREE_DEPLOYMENT.md).
services:
  - type: web
    name: parkshare
    runtime: docker
    plan: free
    region: singapore            # use the same region family as your TiDB instance
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JOBS_TOKEN            # read it in the Render dashboard (Environment) and paste it into the cron job
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: WEB_CONCURRENCY       # free instance = 512 MB RAM
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: SECURE_HSTS_SECONDS
        value: "0"
      - key: ADMIN_URL
        value: "staff-change-me/"
      - key: CSP_MODE
        value: report-only
      - key: DB_ENGINE
        value: django_tidb
      - key: DB_PORT
        value: "4000"
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SITE_URL              # set after the first deploy, e.g. https://parkshare-xxxx.onrender.com
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
