{% load static %}<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Parking360 | Reserve parking before you arrive{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Find and book parking near you, pay online and check in with a 6-character code. Owners manage bookings and earnings in one dashboard.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ SITE_NAME }}">
  <meta property="og:title" content="{% block og_title %}Parking360 | Reserve parking before you arrive{% endblock %}">
  <meta property="og:description" content="Search by area, pay online, check in with a code.">
  <meta property="og:url" content="{{ SITE_URL }}{{ request.path }}">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <script src="{% static 'js/theme.js' %}"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% include "partials/_messages.html" %}
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:1rem">
        <div class="modal-header border-0 pb-0"><h2 class="modal-title fs-5" id="confirmTitle">Please confirm</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body" data-confirm-message></div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" data-confirm-accept>Confirm</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
