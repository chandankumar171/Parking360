{% if show %}
<div class="dropdown">
  <button class="icon-btn position-relative" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Notifications{% if unread %}, {{ unread }} unread{% endif %}">
    <i class="bi bi-bell"></i>{% if unread %}<span class="bell-dot">{% if unread > 9 %}9+{% else %}{{ unread }}{% endif %}</span>{% endif %}
  </button>
  <div class="dropdown-menu dropdown-menu-end p-0 bell-menu">
    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
      <strong>Notifications</strong>
      {% if unread %}<form method="post" action="{% url 'core:notifications_read_all' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn btn-link btn-sm p-0" type="submit">Mark all read</button></form>{% endif %}
    </div>
    <div class="bell-list">
      {% for n in items %}
      <a class="bell-item {% if not n.is_read %}unread{% endif %}" href="{% if n.link %}{% url 'core:notification_go' n.pk %}{% else %}{% url 'core:notifications' %}{% endif %}">
        <div class="fw-semibold small">{{ n.title }}</div>{% if n.message %}<div class="small text-muted text-truncate">{{ n.message }}</div>{% endif %}
        <div class="small text-muted">{{ n.created_at|timesince }} ago</div></a>
      {% empty %}<div class="empty py-4"><i class="bi bi-bell"></i>You're all caught up.</div>{% endfor %}
    </div>
    <a class="d-block text-center small py-2 border-top" href="{% url 'core:notifications' %}">See all</a>
  </div>
</div>
{% endif %}
