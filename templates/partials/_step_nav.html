<div class="d-flex flex-wrap gap-2 justify-content-between mt-4">
  <div>{% if prev_step %}<a class="btn btn-outline-secondary" href="{% url 'owner:parking_edit' parking.pk prev_step %}"><i class="bi bi-arrow-left"></i> Back</a>{% endif %}</div>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-primary" type="submit" name="action" value="save">Save</button>
    {% if next_step %}<button class="btn btn-primary" type="submit" name="action" value="continue">Save and continue <i class="bi bi-arrow-right"></i></button>{% endif %}
  </div>
</div>
